<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Up!</title>
<script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
<style>
  :root {
    --bg: #17110d;
    --panel: #241a14;
    --line: #3d2d22;
    --paper: #fff3d6;
    --ink: #2a1d14;
    --text: #fbead0;
    --dim: #a08a74;
    --red: #ff4b3e;
    --yellow: #ffc83d;
    --green: #4fd67a;
    --blue: #5fb8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Everything is sized in rem, and rem follows the window, so the layout
     fills a laptop or a projector the same way. */
  html { font-size: min(1.05vw, 1.75vh); }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: 7.5rem minmax(0, 1fr) 10rem 10.5rem 4rem;
    gap: 0.8rem;
    padding: 1rem 1.6rem;
  }
  section { display: flex; flex-direction: column; min-height: 0; }
  h2 {
    font-size: 1.3rem;
    letter-spacing: 0.25em;
    color: var(--dim);
    margin-bottom: 0.5rem;
  }

  /* ---- Header ---- */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    border-bottom: 0.25rem solid var(--line);
  }
  .big-stat { display: flex; flex-direction: column; }
  .big-stat .label { font-size: 1.3rem; letter-spacing: 0.25em; color: var(--dim); }
  .big-stat .value { font-size: 5rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  #time-box { align-items: flex-end; }
  #time.low { color: var(--red); animation: pulse 0.8s infinite; }
  .title {
    font-size: 4rem; font-weight: 900; letter-spacing: 0.08em;
    color: var(--yellow);
    text-shadow: 0.25rem 0.25rem 0 var(--red);
    text-align: center;
  }
  .online { display: flex; gap: 0.6rem; justify-content: center; margin-top: 0.4rem; }
  .pill {
    font-size: 1.05rem; letter-spacing: 0.12em; padding: 0.2rem 0.7rem; border-radius: 1rem;
    background: #3a2b22; color: var(--dim);
  }
  .pill.on { background: #1f4d30; color: #bff5cf; }
  .pill.off { background: #5a1c17; color: #ffc9c4; }

  /* ---- Tickets ---- */
  #tickets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; flex: 1; min-height: 0; align-items: start; }
  .ticket {
    background: var(--paper); color: var(--ink);
    border-radius: 0.5rem;
    padding: 0.8rem 1.1rem 1rem;
    display: flex; flex-direction: column; gap: 0.7rem;
    position: relative;
    box-shadow: 0 0.4rem 0 #c9b48f;
    animation: drop-in 0.45s cubic-bezier(.2,1.6,.4,1);
    border-top: 0.6rem dashed #d9c39b;
    max-height: 100%;
  }
  .ticket .head { display: flex; align-items: center; gap: 0.7rem; }
  .ticket .dish { font-size: 3.8rem; line-height: 1; }
  .ticket .name { font-size: 2.3rem; font-weight: 900; text-transform: uppercase; line-height: 1.05; }
  .ticket .pts { font-size: 1.2rem; color: #7b6650; }
  .ticket .needs { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .need {
    font-size: 1.25rem; padding: 0.25rem 0.55rem; border-radius: 0.4rem;
    background: #f1dfb8; color: #6b5641; display: flex; align-items: center; gap: 0.3rem;
  }
  .need.have { background: #c9f2d4; color: #1c5c31; }
  .need.have::after { content: "✓"; font-weight: 900; }
  .bar { height: 1.3rem; background: #e3cfa8; border-radius: 0.7rem; overflow: hidden; }
  .bar > div { height: 100%; background: var(--green); border-radius: 0.7rem; }
  .ticket .secs { margin-left: auto; font-size: 2.8rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .ticket.warn .bar > div { background: var(--yellow); }
  .ticket.urgent { background: #ffd9d4; animation: shake 0.5s infinite; }
  .ticket.urgent .bar > div { background: var(--red); }
  .ticket.urgent .secs { color: #c0170c; }
  .ticket.ready { outline: 0.5rem solid var(--green); }
  .ticket.ready::after {
    content: "READY"; position: absolute; top: 0.8rem; right: -0.6rem;
    background: var(--green); color: #08260f; font-weight: 900; font-size: 1.3rem;
    padding: 0.2rem 0.8rem; transform: rotate(8deg); border-radius: 0.3rem;
  }
  .ticket.gone { animation: fly-out 0.4s forwards; }
  .empty-orders { color: var(--dim); font-size: 2rem; align-self: center; }

  /* ---- Counter ---- */
  #counter { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1rem; flex: 1; min-height: 0; }
  .slot {
    border-radius: 0.6rem; background: var(--panel); border: 0.25rem solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .slot.empty { border-style: dashed; }
  .slot .num { position: absolute; top: 0.3rem; left: 0.6rem; color: var(--dim); font-size: 1.1rem; }
  .slot .icon { font-size: 3.4rem; line-height: 1.1; }
  .slot .label { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; text-align: center; }
  .slot.bad { background: #4a1612; border-color: var(--red); animation: pulse 1.2s infinite; }
  .slot.full-warning { border-color: var(--red); }
  .icon .badge { font-size: 0.45em; vertical-align: top; }

  /* ---- Stations ---- */
  .stations { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  .station {
    background: var(--panel); border: 0.25rem solid var(--line); border-radius: 0.6rem;
    padding: 0.8rem 1.4rem; display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1.2rem;
    align-items: center; align-content: center; min-height: 0;
  }
  .station .icon { font-size: 5rem; grid-row: span 3; }
  .station .sname { font-size: 1.2rem; letter-spacing: 0.25em; color: var(--dim); }
  .station .item { font-size: 2.2rem; font-weight: 900; text-transform: uppercase; line-height: 1; }
  .station .row { display: flex; align-items: center; gap: 1.2rem; }
  .station .row > :first-child { flex: 0 1 50%; }
  .station .status { font-size: 2rem; font-weight: 900; }
  .dots { display: flex; gap: 0.5rem; }
  .dot { width: 2rem; height: 2rem; border-radius: 50%; border: 0.25rem solid var(--yellow); }
  .dot.full { background: var(--yellow); }
  .station .bar { background: #3d2d22; height: 2rem; border-radius: 1rem; width: 100%; }
  .station .bar > div { background: var(--yellow); transition: width 0.2s linear; }
  .station.go { border-color: var(--green); }
  .station.go .status { color: var(--green); animation: pulse 0.5s infinite; }
  .station.alarm { border-color: var(--red); background: #3a1310; }
  .station.alarm .status { color: var(--red); animation: pulse 0.4s infinite; }
  .station.idle .item, .station.idle .status { color: var(--dim); }
  .station.offline { opacity: 0.45; }

  /* ---- Message bar ---- */
  footer {
    display: flex; align-items: center; gap: 1rem;
    font-size: 2.2rem; font-weight: 800;
    border-top: 0.25rem solid var(--line); padding-top: 0.6rem;
  }
  footer .who { color: var(--dim); text-transform: uppercase; font-size: 1.5rem; letter-spacing: 0.2em; }
  footer.ok .text { color: var(--green); }
  footer.bad .text { color: var(--red); }
  footer.flash { animation: flash 0.6s; }

  /* ---- Overlay (lobby / game over) ---- */
  #overlay {
    position: fixed; inset: 0; background: rgba(15, 9, 6, 0.93);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay .huge { font-size: 9rem; font-weight: 900; color: var(--yellow); text-shadow: 0.4rem 0.4rem 0 var(--red); }
  #overlay .sub { font-size: 2.6rem; }
  #overlay .hint { font-size: 2rem; color: var(--dim); }
  #overlay .stats { display: flex; gap: 3rem; font-size: 2.2rem; }
  #overlay .stats b { display: block; font-size: 4.5rem; color: var(--text); }
  #overlay .online { gap: 1rem; }
  #overlay .pill { font-size: 1.6rem; padding: 0.4rem 1.2rem; }

  #disconnected {
    position: fixed; top: 0; left: 0; right: 0; background: var(--red); color: white;
    text-align: center; font-size: 1.6rem; font-weight: 800; padding: 0.4rem; display: none;
  }

  /* ---- Toasts ---- */
  #toasts { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .toast {
    position: absolute; font-size: 6rem; font-weight: 900; white-space: nowrap;
    text-shadow: 0.3rem 0.3rem 0 rgba(0,0,0,0.6);
    animation: float-up 1.6s ease-out forwards;
  }
  .toast.good { color: var(--green); }
  .toast.bad { color: var(--red); }
  .toast.info { color: var(--yellow); font-size: 4rem; }

  @keyframes pulse { 50% { opacity: 0.45; } }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-0.3rem) rotate(-1deg); }
    75% { transform: translateX(0.3rem) rotate(1deg); }
  }
  @keyframes drop-in { from { transform: translateY(-120%) rotate(-6deg); opacity: 0; } }
  @keyframes fly-out { to { transform: translateY(-40%) scale(0.8); opacity: 0; } }
  @keyframes flash { 0% { background: rgba(255, 200, 61, 0.35); } 100% { background: transparent; } }
  @keyframes float-up {
    0% { transform: translateY(2rem) scale(0.6); opacity: 0; }
    15% { transform: translateY(0) scale(1.1); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translateY(-10rem) scale(1); opacity: 0; }
  }
</style>
</head>
<body>
  <header>
    <div class="big-stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
    <div>
      <div class="title">ORDER UP!</div>
      <div class="online" id="online"></div>
    </div>
    <div class="big-stat" id="time-box"><span class="label">TIME</span><span class="value" id="time">3:00</span></div>
  </header>

  <section><h2>ORDERS</h2><div id="tickets"></div></section>
  <section><h2>COUNTER</h2><div id="counter"></div></section>
  <section class="stations">
    <div class="station" id="chop"></div>
    <div class="station" id="cook"></div>
  </section>
  <footer id="message"><span class="who"></span><span class="text"></span></footer>

  <div id="overlay"></div>
  <div id="toasts"></div>
  <div id="disconnected">Lost connection to the game server. Is app.py running?</div>

<script>
// ---- Names and pictures ---------------------------------------------------
const ITEMS = {
  lettuce:         { icon: "🥬", label: "Lettuce" },
  tomato:          { icon: "🍅", label: "Tomato" },
  patty:           { icon: "🥩", label: "Raw patty" },
  bun:             { icon: "🍞", label: "Bun" },
  chopped_lettuce: { icon: "🥬", badge: "🔪", label: "Chopped lettuce" },
  chopped_tomato:  { icon: "🍅", badge: "🔪", label: "Chopped tomato" },
  cooked_patty:    { icon: "🍖", label: "Cooked patty" },
  soup:            { icon: "🍲", label: "Soup" },
  ruined:          { icon: "🤢", label: "Ruined" },
  burnt:           { icon: "💀", label: "Burnt" },
};
const DISHES = {
  salad:  { icon: "🥗", label: "Salad" },
  burger: { icon: "🍔", label: "Burger" },
  soup:   { icon: "🍲", label: "Tomato soup" },
};
const item = (key) => ITEMS[key] || { icon: "❓", label: (key || "").replace(/_/g, " ") };
const icon = (key) => {
  const it = item(key);
  return it.icon + (it.badge ? `<span class="badge">${it.badge}</span>` : "");
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (id) => document.getElementById(id);

// ---- State --------------------------------------------------------------------
let state = null;
let receivedAt = performance.now();
const cache = {};        // last JSON drawn per section, so we only redraw on change
const ticketEls = new Map();
let lastMessageSeq = null;

const socket = io();
socket.on("connect", () => { $("disconnected").style.display = "none"; });
socket.on("disconnect", () => { $("disconnected").style.display = "block"; });
socket.on("state", (s) => { state = s; receivedAt = performance.now(); draw(); });
socket.on("events", (events) => events.forEach(onEvent));

document.addEventListener("keydown", (e) => {
  unlockAudio();
  if (e.code === "Space" || e.code === "Enter") { socket.emit("start"); e.preventDefault(); }
  if (e.code === "Escape") socket.emit("lobby");
  if (e.code === "KeyM") muted = !muted;
});

function changed(key, value) {
  const json = JSON.stringify(value);
  if (cache[key] === json) return false;
  cache[key] = json;
  return true;
}

function draw() {
  if (!state) return;
  $("score").textContent = state.score;
  const t = state.time_left;
  $("time").textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
  $("time").classList.toggle("low", state.phase === "playing" && t <= 20);
  if (changed("online", state.online)) drawOnline($("online"));
  drawTickets();
  if (changed("counter", state.counter)) drawCounter();
  if (changed("chop", [state.chop, state.online.chop])) drawChop();
  if (changed("cook", [state.cook, state.online.cook])) drawCook();
  drawMessage();
  if (changed("overlay", [state.phase, state.score, state.stats, state.online])) drawOverlay();
}

function drawOnline(el) {
  el.innerHTML = ["chop", "cook", "runner"].map((s) =>
    `<span class="pill ${state.online[s] ? "on" : "off"}">${s.toUpperCase()} ${state.online[s] ? "●" : "○"}</span>`
  ).join("");
}

// Which of a ticket's ingredients are on the counter right now?
function haveList(needs) {
  const pool = state.counter.filter(Boolean);
  return needs.map((n) => {
    const i = pool.indexOf(n);
    if (i >= 0) { pool.splice(i, 1); return true; }
    return false;
  });
}

function drawTickets() {
  const box = $("tickets");
  const ids = new Set(state.tickets.map((t) => t.id));
  for (const [id, el] of ticketEls) {
    if (!ids.has(id)) {
      ticketEls.delete(id);
      el.classList.add("gone");
      setTimeout(() => el.remove(), 400);
    }
  }
  for (const t of state.tickets) {
    let el = ticketEls.get(t.id);
    if (!el) {
      el = document.createElement("div");
      el.className = "ticket";
      ticketEls.set(t.id, el);
      box.appendChild(el);
    }
    const have = haveList(t.needs);
    const key = JSON.stringify([t.recipe, have, t.ready]);
    if (el.dataset.key !== key) {
      el.dataset.key = key;
      const dish = DISHES[t.recipe] || { icon: "🍽️", label: t.recipe };
      el.innerHTML = `
        <div class="head"><span class="dish">${dish.icon}</span>
          <div><div class="name">${esc(dish.label)}</div><div class="pts">#${t.id} · ${t.points} pts</div></div>
          <div class="secs"></div></div>
        <div class="needs">${t.needs.map((n, i) =>
          `<span class="need ${have[i] ? "have" : ""}">${icon(n)} ${esc(item(n).label)}</span>`).join("")}</div>
        <div class="bar"><div></div></div>`;
    }
    el.classList.toggle("ready", t.ready);
    el.dataset.timeLeft = t.time_left;
    el.dataset.duration = t.duration;
  }
  const empty = box.querySelector(".empty-orders");
  if (state.tickets.length === 0 && !empty) {
    box.insertAdjacentHTML("beforeend", `<div class="empty-orders">No orders yet…</div>`);
  } else if (state.tickets.length && empty) {
    empty.remove();
  }
}

function drawCounter() {
  const full = state.counter.every(Boolean);
  $("counter").innerHTML = state.counter.map((it, i) => {
    if (!it) return `<div class="slot empty"><span class="num">${i + 1}</span></div>`;
    const bad = it === "burnt" || it === "ruined";
    return `<div class="slot ${bad ? "bad" : ""} ${full ? "full-warning" : ""}">
      <span class="num">${i + 1}</span><span class="icon">${icon(it)}</span>
      <span class="label">${esc(item(it).label)}</span></div>`;
  }).join("");
}

function stationShell(el, name, iconHtml, itemText, statusText, extra, mood) {
  el.className = `station ${mood}`;
  el.innerHTML = `<span class="icon">${iconHtml}</span>
    <span class="sname">${name}</span>
    <span class="item">${itemText}</span>
    <div class="row">${extra || ""}<div class="status">${statusText}</div></div>`;
}

function drawChop() {
  const c = state.chop;
  const el = $("chop");
  const off = state.online.chop ? "" : " offline";
  if (!c.item) {
    stationShell(el, "CHOP 🔪" + (off ? " · OFFLINE" : ""), "🔪", "Empty", "Waiting for food", "", "idle" + off);
    return;
  }
  const dots = Array.from({ length: c.needed }, (_, i) => `<span class="dot ${i < c.progress ? "full" : ""}"></span>`).join("");
  let status = "CHOP!", mood = "";
  if (c.result && c.waiting) { status = `${item(c.result).label}: counter full!`; mood = "alarm"; }
  else if (c.result) { status = "Done!"; mood = "go"; }
  stationShell(el, "CHOP 🔪", icon(c.item), esc(item(c.item).label), status,
               `<div class="dots">${dots}</div>`, mood + off);
}

function drawCook() {
  const c = state.cook;
  const el = $("cook");
  const off = state.online.cook ? "" : " offline";
  if (!c.item) {
    stationShell(el, "COOK 🍳" + (off ? " · OFFLINE" : ""), "🍳", "Empty", "Pan is empty", "", "idle" + off);
    return;
  }
  const pct = Math.round(c.progress * 100);
  let status = "STIR!", mood = "", label = esc(item(c.item).label);
  if (c.status === "done") {
    status = `PULL IT! ${c.burn_in}s`;
    mood = "go";
    label = `${esc(item(c.result).label)}`;
  } else if (c.status === "burning") {
    status = "BURNT! Pull it off";
    mood = "alarm";
    label = "Burnt " + esc(item(c.item).label.replace(/^raw /i, "").toLowerCase());
  }
  stationShell(el, "COOK 🍳", icon(c.status === "burning" ? "burnt" : (c.result || c.item)), label, status,
               `<div class="bar"><div style="width:${pct}%"></div></div>`, mood + off);
}

function drawMessage() {
  const m = state.message;
  const el = $("message");
  if (!m) { el.querySelector(".who").textContent = ""; el.querySelector(".text").textContent = ""; return; }
  if (m.seq === lastMessageSeq) return;
  lastMessageSeq = m.seq;
  el.querySelector(".who").textContent = m.station === "server" ? "Kitchen" : m.station;
  el.querySelector(".text").textContent = m.text;
  el.className = m.ok ? "ok" : "bad";
  void el.offsetWidth;  // restart the flash animation
  el.classList.add("flash");
}

function drawOverlay() {
  const o = $("overlay");
  if (state.phase === "playing") { o.classList.remove("show"); return; }
  o.classList.add("show");
  const pills = document.createElement("div");
  pills.className = "online";
  drawOnline(pills);
  if (state.phase === "lobby") {
    o.innerHTML = `<div class="huge">ORDER UP!</div>
      <div class="sub">Runner fetches · Chopper chops · Cook stirs</div>
      <div class="sub">${Math.round(state.round_seconds / 60)} minutes. Serve as many orders as you can.</div>
      ${pills.outerHTML}
      <div class="hint">Runner: press the joystick to start (or press Space here)</div>`;
  } else {
    const s = state.stats;
    o.innerHTML = `<div class="huge">TIME!</div>
      <div class="sub">Final score</div>
      <div class="huge" style="font-size:12rem">${state.score}</div>
      <div class="stats">
        <div><b>${s.served}</b>served</div><div><b>${s.expired}</b>expired</div>
        <div><b>${s.burnt}</b>burnt</div><div><b>${s.trashed}</b>trashed</div></div>
      <div class="hint">Runner: press the joystick to play again (or press Space)</div>`;
  }
}

// ---- Smooth countdown bars between state updates ------------------------------
function animate() {
  const elapsed = (performance.now() - receivedAt) / 1000;
  for (const el of ticketEls.values()) {
    const left = Math.max(0, Number(el.dataset.timeLeft) - elapsed);
    const frac = left / Number(el.dataset.duration);
    const bar = el.querySelector(".bar > div");
    if (bar) bar.style.width = `${(frac * 100).toFixed(1)}%`;
    const secs = el.querySelector(".secs");
    if (secs) secs.textContent = `${Math.ceil(left)}s`;
    el.classList.toggle("urgent", left <= 10);
    el.classList.toggle("warn", left > 10 && left <= 25);
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---- Event toasts and sounds ----------------------------------------------------
function toast(text, kind) {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.textContent = text;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

function onEvent(e) {
  if (e.type === "served") {
    toast(`+${e.points + e.tip} ${(DISHES[e.recipe] || {}).icon || ""}`, "good");
    beep([660, 880, 1320], 0.09);
  } else if (e.type === "expired") {
    toast(`−${e.penalty} ${(DISHES[e.recipe] || {}).label || ""} expired`, "bad");
    beep([300, 200], 0.18);
  } else if (e.type === "burnt") {
    toast("💀 BURNT!", "bad");
    beep([220, 180, 140], 0.15);
  } else if (e.type === "new_ticket") {
    beep([1046, 1318], 0.07);
  } else if (e.type === "cook_done") {
    beep([880, 880], 0.08);
  } else if (e.type === "round_start") {
    toast("GO!", "info");
  }
}

let audio = null, muted = false;
function unlockAudio() {
  if (!audio) { try { audio = new AudioContext(); } catch (err) { audio = null; } }
  if (audio && audio.state === "suspended") audio.resume();
}
document.addEventListener("click", unlockAudio);
function beep(freqs, len) {
  if (!audio || muted) return;
  let t = audio.currentTime;

    const osc = audio.createOscillator(), gain = audio.createGain();

    osc.frequency.value = f;
    gain.gain.setValueAtTime(0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + len);

    osc.start(t); osc.stop(t + len);
    t += len;
  }
}
