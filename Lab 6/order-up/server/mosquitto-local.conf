# Backup broker for demo day, if the class broker or campus Wi-Fi lets us down.
# Install Mosquitto on the laptop (brew install mosquitto / apt install mosquitto), then:
#
#     mosquitto -c mosquitto-local.conf
#
# and start everything with --broker <laptop IP> (or ORDERUP_BROKER=<laptop IP>).
# The class username/password are simply accepted, so nothing else changes.

listener 1883 0.0.0.0
allow_anonymous true
